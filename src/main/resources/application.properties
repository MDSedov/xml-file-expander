spring.application.name=xml-file-expander

# The UI is intentionally local-only. Change this explicitly only inside a trusted network.
server.address=127.0.0.1
server.port=7080

spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
spring.servlet.multipart.file-size-threshold=1MB
server.tomcat.max-swallow-size=-1

# Keep all writes inside the directory from which the application was started.
xml-expander.work-directory=${user.dir}/xml-file-expander-work
xml-expander.default-output-directory=${user.dir}
