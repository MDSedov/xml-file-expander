spring.application.name=xml-file-expander

# The UI is intentionally local-only. Change this explicitly only inside a trusted network.
server.address=127.0.0.1
server.port=7080

spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
spring.servlet.multipart.file-size-threshold=1MB
server.tomcat.max-swallow-size=-1

xml-expander.work-directory=${java.io.tmpdir}/xml-file-expander
xml-expander.default-output-directory=./output
